<header>
  <div class="sprachen" role="group" [attr.aria-label]="t().sprachwahl">
    @for (s of sprachen; track s.wert) {
      <button
        type="button"
        [attr.lang]="s.wert"
        [attr.aria-pressed]="uebersetzung.sprache() === s.wert"
        (click)="uebersetzung.waehle(s.wert)"
      >
        {{ s.name }}
      </button>
    }
  </div>
  <h1>{{ t().ueberschrift }}</h1>
  <p>{{ t().untertitel }}</p>
</header>

<app-quiz />

<footer>
  <p>
    {{ t().quelleVor }}
    <i lang="de">{{ buchtitel }}</i>{{ t().quelleNach }}
  </p>
</footer>
